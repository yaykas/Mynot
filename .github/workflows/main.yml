name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir www && cp index.html www/
      - run: npm install
      - name: Prepare photo scanner
        run: |
          mkdir -p www/tesseract
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/tesseract/
          cp node_modules/tesseract.js-core/tesseract-core* www/tesseract/
          curl -fL -o www/tesseract/rus.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata
          curl -fL -o www/tesseract/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow exact alarms
        run: sed -i 's|<application|<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cadence-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
