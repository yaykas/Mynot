name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir www && cp index.html www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow exact alarms
        run: sed -i 's|<application|<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
